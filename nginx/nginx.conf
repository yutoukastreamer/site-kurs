server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ── Известные маршруты приложения → отдаём index.html со статусом 200 ──
    #    Если в React Router добавляется новый путь — допиши его сюда же.
    location = /           { try_files /index.html =404; }
    location = /bulldozer  { try_files /index.html =404; }
    location = /excavator  { try_files /index.html =404; }
    location = /grader     { try_files /index.html =404; }
    location = /news       { try_files /index.html =404; }

    # ── Статика (js, css, изображения, видео, шрифты) ──
    location ~* \.(?:js|css|png|jpe?g|gif|ico|svg|webp|mp4|webm|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Любой другой путь не существует как файл ──
    location / {
        try_files $uri =404;
    }

    # ── Несуществующий путь отдаёт страницу 404 ИМЕННО со статусом 404 ──
    #    404.html — копия index.html (создаётся при сборке), поэтому
    #    загружается то же React-приложение и роутер рисует нашу 404.
    #    error_page сохраняет код 404 (а try_files отдал бы 200).
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
